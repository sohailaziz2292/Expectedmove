[project]
name = "expected-move"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.32", "PyYAML>=6.0"]

[project.scripts]
mmd = "mmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
