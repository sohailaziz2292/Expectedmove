name: lock-guard

# Insurance for the 08:30 ET deadline. If the pre-market pipeline was delayed
# or failed, this freezes and publishes the most recent good draft rather than
# letting the site show nothing at the open. It never builds — only locks.

on:
  schedule:
    - cron: '14,20 12,13 * * 1-5'   # ~08:14 and ~08:20 ET, both DST offsets
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Lock if the window is closing
        id: lock
        env:
          PYTHONPATH: src
        run: |
          PHASE=$(python -m mmd.cli phase | jq -r .phase)
          SECS=$(python -m mmd.cli phase | jq -r .seconds_to_lock)
          echo "phase=$PHASE secs_to_lock=$SECS"
          if [ "$PHASE" != "final" ] && [ "$PHASE" != "locked" ]; then
            echo "outside the lock window, nothing to do"
            echo "acted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m mmd.cli -v lock
          echo "acted=true" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.lock.outputs.acted == 'true'
        run: |
          git config user.name  'mmd-bot'
          git config user.email 'mmd-bot@users.noreply.github.com'
          git add data site/feed.json
          git diff --cached --quiet || {
            git commit -m 'lock: pre-open freeze'
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            git push
          }

      - name: Raise an issue if the deadline was missed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Missed the 08:30 ET publish deadline (${new Date().toISOString().slice(0,10)})`,
              body: `The lock guard failed. The site is serving a stale or missing list.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['deadline-miss'],
            })
